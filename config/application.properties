# tcp-probe-service configuration
#
# Precedence: built-in defaults < this file < PROBE_* environment variables < --cli args.
# Every key here is optional; the commented values are the built-in defaults.
# Unknown keys make the process exit with code 2 instead of being silently ignored.

# --- HTTP server -------------------------------------------------------------
#server.bind=0.0.0.0
#server.port=8080

# --- probing -----------------------------------------------------------------
# Per-attempt TCP connect timeout. Bump it for far-away targets.
#probe.timeout-ms=2000
# DNS lookups get their own timeout: a hung resolver must not be reported as a
# connect timeout. Keep it >= 500ms in real networks (cold resolver caches).
#probe.dns-timeout-ms=2000
# How many TCP connects may be in flight at once. This is the backpressure knob.
#probe.max-in-flight=64
#probe.max-targets-per-request=200

# --- tasks -------------------------------------------------------------------
# Concurrent probe tasks; exceeding it returns 503 SERVER_BUSY.
#task.max-concurrent=16
#task.workers=4
# How long finished tasks stay queryable in memory.
#task.ttl-seconds=600

# --- rate limiting (token bucket, per process) -------------------------------
#rate-limit.global.rps=50
#rate-limit.global.burst=100
#rate-limit.client.rps=10
#rate-limit.client.burst=20

# --- request handling --------------------------------------------------------
# Upper bound for a synchronous request before it is answered with 202 instead.
#sync.max-wait-ms=30000
#http.max-body-bytes=1048576
# Only enable behind a proxy you control; otherwise clients can spoof the
# rate-limit identity via X-Forwarded-For.
#http.trust-proxy-header=false

# --- observability -----------------------------------------------------------
#log.level=INFO
