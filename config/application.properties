# tcp-probe-service 配置
#
# 优先级：内置默认值 < 本文件 < PROBE_* 环境变量 < --cli 参数。
# 这里每个 key 都是可选的；注释里的值就是内置默认值。
# 未知 key 会让进程以退出码 2 退出，而不是被静默忽略。

# --- HTTP 服务 ---------------------------------------------------------------
#server.bind=0.0.0.0
#server.port=8080

# --- 探测 --------------------------------------------------------------------
# 单次 TCP 连接尝试的超时。目标很远时可以调大。
#probe.timeout-ms=2000
# DNS 解析有自己的超时：解析卡住不能被报成连接超时。
# 在真实网络里请保持 >= 500ms（解析器缓存冷启动时更慢）。
#probe.dns-timeout-ms=2000
# 同时允许多少个 TCP 连接在途。这就是背压旋钮。
#probe.max-in-flight=64
#probe.max-targets-per-request=200

# --- 任务 --------------------------------------------------------------------
# 并发探测任务数；超过就返回 503 SERVER_BUSY。
#task.max-concurrent=16
#task.workers=4
# 已完成任务在内存里还能被查询多久。
#task.ttl-seconds=600

# --- 限流（令牌桶，按进程） --------------------------------------------------
#rate-limit.global.rps=50
#rate-limit.global.burst=100
#rate-limit.client.rps=10
#rate-limit.client.burst=20

# --- 请求处理 ----------------------------------------------------------------
# 同步请求的上限；超过就改成 202 立即返回。
#sync.max-wait-ms=30000
#http.max-body-bytes=1048576
# 只有在你掌控的代理后面才打开；否则客户端可以伪造 X-Forwarded-For
# 来绕过按客户端限流。
#http.trust-proxy-header=false

# --- 可观测性 ----------------------------------------------------------------
#log.level=INFO
